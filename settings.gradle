pluginManagement {
    repositories {
        maven {
            name = 'Outlands'
            url = 'https://maven.outlands.top/releases/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenLocal()
        gradlePluginPortal()
    }
}

rootProject.name = 'Outlands'

// MCP layer: decompile -> access transformers -> mcpcleanup -> rename, plus the patch application
include ':mcpbase'
// The loader: patched Minecraft + loader sources, reobf, binary patches, packaging
include ':outlands'

project(":mcpbase").projectDir = file("projects/mcpbase")
project(":outlands").projectDir = file("projects/outlands")
