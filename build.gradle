buildscript {
    repositories {
        mavenLocal()
        maven {
            name = "Outlands"
            url = 'https://maven.outlands.top/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // :outlands packs 'binpatches.pack.lzma' (LZMA + jar merging) at build time
        classpath 'org.apache.commons:commons-compress:1.28.0'
        classpath 'org.tukaani:xz:1.12'
    }
}

plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
}

import top.outlands.gradle.helpers.ProjectConstants
import top.outlands.gradle.helpers.ReleaseVersions
import top.outlands.gradle.helpers.tasks.Util

def sysProps = System.getProperties()

group = 'top.outlands'

// region version -------------------------------------------------------------
// CalVer, YYYY.MM.DD, in UTC so that a build on two different machines on the same day agrees. Nothing else goes
// into the version: no commit distance, no dirty flag, no CI run number. A build is therefore not identifiable by
// its version alone, and repeated builds on one day produce the same file names on purpose (they overwrite rather
// than accumulate).
//
// Same-day releases are only ever numbered at publish time: the first one of the day is 'YYYY.MM.DD', the next ones
// are 'YYYY.MM.DD-2', 'YYYY.MM.DD-3', ... CalVer's RELEASE modifier starts at 2 for the second build, and Maven's
// ComparableVersion ranks '2026.10.23-2' above '2026.10.23', so 'latest'/'release' keep resolving forwards.
//
// CI never invents a suffix of its own: 'Prepare Release' computes it, creates the matching tag, and the tag then
// feeds both values back into the release build (-PcalverDate/-PcalverSuffix), so the published version and the tag
// can not drift apart.
def calverFormat = java.time.format.DateTimeFormatter.ofPattern('yyyy.MM.dd')
def calverDate = (findProperty('calverDate')
        ?: java.time.LocalDate.now(java.time.ZoneOffset.UTC).format(calverFormat)).toString()
def calverSuffix = (findProperty('calverSuffix') ?: '').toString()
if (calverSuffix.startsWith('-')) calverSuffix = calverSuffix.substring(1)
if (!(calverDate ==~ /\d{4}\.\d{2}\.\d{2}/))
    throw new GradleException("calverDate must be YYYY.MM.DD, got '${calverDate}'")
if (calverSuffix && (!(calverSuffix ==~ /\d+/) || calverSuffix.toInteger() < 2))
    throw new GradleException("calverSuffix must be omitted or 2, 3, 4, ... (the CalVer release modifier), got '${calverSuffix}'")

version = calverDate + (calverSuffix ? "-${calverSuffix}" : '')

def version_txt = new File(project.projectDir, "version.txt")
version_txt.write(version.toString())

println "Setting up Outlands ${version}"
println "Java: ${ -> sysProps['java.version']} | JVM: ${ -> sysProps['java.vm.version']} | Vendor: ${ -> sysProps['java.vendor']} | Architecture: ${ -> sysProps['os.arch']}"
// endregion

// Initialize buildSrc
Util.init()

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = options.compilerArgs + ProjectConstants.COMPILER_JVM_ARGUMENTS
    options.encoding = 'UTF-8'
}

idea.project.settings.compiler.javac.javacAdditionalOptions = ProjectConstants.COMPILER_JVM_ARGUMENTS.join(' ')

// region git hooks -----------------------------------------------------------
// The commit message rules live in .githooks/, which is tracked, but git only reads .git/hooks unless
// core.hooksPath points somewhere else - and that setting is part of a clone, not of the repository. Installing it
// from here means the check is on for anyone who opens the project in IDEA (see the sync trigger below) or runs any
// Gradle task once, without a setup step to remember.
//
// It stays best effort on purpose: a source archive has no .git, a shallow clone still commits fine, and a build
// must never fail over a hook.
tasks.register('installGitHooks') {
    group = 'setup'
    description = 'Points core.hooksPath at .githooks so a commit message is checked before the commit is created.'
    // Always runs: 'git config' is cheap and idempotent, and the hook files may have been added since the last run.
    outputs.upToDateWhen { false }

    doLast {
        if (!new File(rootDir, '.git').exists()) {
            logger.info('Not a git checkout, leaving core.hooksPath alone')
            return
        }

        def hooks = new File(rootDir, '.githooks')

        if (!hooks.isDirectory()) {
            logger.warn("installGitHooks: ${hooks} is missing")
            return
        }

        // A checkout that lost the executable bit (Windows, a zip of the working tree) would make git skip the hook
        // silently, which is the one failure mode that looks like success.
        hooks.listFiles({ it.isFile() } as java.io.FileFilter)?.each { file ->
            if (!file.setExecutable(true, false)) logger.warn("installGitHooks: could not mark ${file.name} executable")
        }

        // Relative on purpose: git resolves core.hooksPath against the top of the working tree, so the clone can be
        // moved or renamed without the configuration going stale.
        def result = ReleaseVersions.gitResult(rootDir, 'config', 'core.hooksPath', '.githooks')

        if (result.exit != 0) {
            logger.warn("installGitHooks: git config failed (${result.exit}): ${result.output.trim()}")
        } else {
            logger.lifecycle('Commit messages are checked against .githooks before a commit is created')
        }
    }
}

// IDEA runs this at the start of a sync, so a clone that is only ever opened in the IDE gets the hook too. 'before'
// and not 'after': a sync that fails later should not leave the clone without the check.
idea.project.settings.taskTriggers.beforeSync(':installGitHooks')
// endregion

// region release -------------------------------------------------------------
// Maintainer entry point: './gradlew release'. It never builds or publishes locally; it verifies the repository
// state, computes the version, and asks CI to do the work (see .github/workflows/Release.yml). The version
// arithmetic lives in one place - ReleaseVersionTask - which CI also runs to check that the version it was asked to
// publish is still the next free one.
//
// It also waits for the run and confirms the result, which needs a token that can read releases as well as dispatch
// workflows (fine-grained PAT: 'Actions: Read and write' + 'Contents: Read'). Without the contents permission the
// release still succeeds - the workflow verifies itself - the confirmation is just reported as unavailable.
def releaseRepository = 'Project-Outlands/Outlands'
def releaseMavenMetadataUrl = 'https://maven.outlands.top/releases/top/outlands/outlands/maven-metadata.xml'
def releaseBranch = 'main'
// 'origin' unless overridden: handy for testing against a mirror or a local clone (-PgitRemote=<name|path>)
def releaseGitRemote = providers.gradleProperty('gitRemote').getOrElse('origin')

tasks.register('releaseVersion', top.outlands.gradle.helpers.tasks.ReleaseVersionTask) { task ->
    task.group = 'release'
    task.description = 'Prints the CalVer version a release started now would use.'
    task.rootDir = layout.projectDirectory
    task.mavenMetadataUrl.set(releaseMavenMetadataUrl)
    task.gitRemote.set(releaseGitRemote)
    task.calverDate.set(calverDate)
    task.expect.set(providers.gradleProperty('expect').getOrElse(''))
}

tasks.register('release', top.outlands.gradle.helpers.tasks.ReleaseTask) { task ->
    task.group = 'release'
    task.description = "Releases the current ${releaseBranch} through CI and waits for the result."
    task.rootDir = layout.projectDirectory
    task.mavenMetadataUrl.set(releaseMavenMetadataUrl)
    task.repository.set(releaseRepository)
    task.gitRemote.set(releaseGitRemote)
    task.defaultBranch.set(releaseBranch)
    task.workflowFile.set('Release.yml')
    task.calverDate.set(calverDate)
    task.token.set(providers.gradleProperty('releaseToken').getOrElse(''))
    task.dryRun.set(providers.gradleProperty('dryRun').isPresent())
    task.noWait.set(providers.gradleProperty('noWait').isPresent())
    task.resumeVersion.set(providers.gradleProperty('releaseVersion').getOrElse(''))
    task.timeoutMinutes.set(providers.gradleProperty('releaseTimeout').map { it as int }.orElse(20))
}
// endregion

tasks.register('setup') {
    group = 'setup'
    description = 'Prepares the patched Minecraft sources and the loader workspace.'
    // Lazily resolved so we do not need evaluationDependsOnChildren
    dependsOn ':mcpbase:applyPatches', ':mcpbase:extractBase'
}

subprojects {
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs += ProjectConstants.COMPILER_JVM_ARGUMENTS
            options.encoding = 'UTF-8'
        }
    }
}
