name: Build and Upload Test Artifact

on:
  # A branch is built once, from its pull request. 'push' fires for every branch a moment before GitHub notices the
  # pull request and starts the second run; both land in the same concurrency group (github.head_ref || github.ref_name
  # is the same string on both events), so the later run cancelled the earlier one and every pull request carried a
  # cancelled check beside the real one. Main still builds here, because the merge commit is not a pull request head.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'buildSrc/**'
      - 'patches/**'
      - 'projects/**/*.gradle'
      - 'templates/**'
      - 'mmcpack-template/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'renovate.json5'
      - 'tools/**'
      - '.github/**'
  # Dependency PRs need to be built before they are merged, not after. Renovate's runs get a read-only token and no
  # secrets, which is all this job asks for.
  pull_request:
    paths:
      - 'src/**'
      - 'buildSrc/**'
      - 'patches/**'
      - 'projects/**/*.gradle'
      - 'templates/**'
      - 'mmcpack-template/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'renovate.json5'
      - 'tools/**'
      - '.github/**'
  workflow_dispatch:

# A new push to the same branch/PR cancels the run it supersedes: 'setup' decompiles Minecraft, it is not cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

run-name: "${{ github.head_ref || github.ref_name }} #${{ github.run_number }}"

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: |
            8
            25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get branch name
        id: branch-names
        uses: tj-actions/branch-names@v9

      - name: Fix Gradle permission
        run: chmod +x ./gradlew

      - name: Setup Forge env
        run: ./gradlew setup

      - name: Stop Gradle daemon
        run: ./gradlew --stop

      - name: Build Jars
        run: ./gradlew build

      - name: Get version
        run: echo "OUTLANDS_VERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Upload Universal Jar
        uses: actions/upload-artifact@v7
        with:
          path: projects/outlands/build/libs/outlands-${{ env.OUTLANDS_VERSION }}.jar
          archive: false

      - name: Upload Installer Jar
        uses: actions/upload-artifact@v7
        with:
          path: projects/outlands/build/libs/outlands-${{ env.OUTLANDS_VERSION }}-installer.jar
          archive: false

      - name: Upload MMC pack zip
        uses: actions/upload-artifact@v7
        with:
          path: projects/outlands/build/libs/outlands-${{ env.OUTLANDS_VERSION }}-local.zip
          archive: false
