name: Build and Upload Test Artifact

on:
  push:
    paths:
      - 'src/**'
      - 'buildSrc/**'
      - 'patches/**'
      - 'projects/**/*.gradle'
      - 'templates/**'
      - 'mmcpack-template/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tools/**'
      - '.github/**'
  workflow_dispatch:

run-name: "${{ github.event_name == 'pull_request' && 'Pull Request Build, DO NOT DOWNLOAD' || format('{0}#{1}: {2}', github.ref_name, github.run_number, github.event.commits[0].message)}}"

permissions:
  contents: read

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get branch name
        id: branch-names
        uses: tj-actions/branch-names@v9

      - name: Fix Gradle permission
        run: chmod +x ./gradlew

      - name: Setup Forge env
        run: ./gradlew setup

      - name: Stop Gradle daemon
        run: ./gradlew --stop

      - name: Build Jars
        run: ./gradlew build

      # Test builds are not released, so they carry no same-day suffix: the version is just today's date and the
      # artifact names say 'local' through the MMC pack.
      - name: Get version
        run: echo "OUTLANDS_VERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Upload Universal Jar
        uses: actions/upload-artifact@v7
        with:
          path: projects/outlands/build/libs/outlands-${{ env.OUTLANDS_VERSION }}.jar
          archive: false

      - name: Upload Installer Jar
        uses: actions/upload-artifact@v7
        with:
          path: projects/outlands/build/libs/outlands-${{ env.OUTLANDS_VERSION }}-installer.jar
          archive: false

      - name: Upload MMC pack zip
        uses: actions/upload-artifact@v7
        with:
          path: projects/outlands/build/libs/outlands-${{ env.OUTLANDS_VERSION }}-local.zip
          archive: false
