// Installer artifacts: install_profile.json + version.json (+ the installer jar that carries them).
//
// This is what launchers (MultiMC/Prism), the installer and dev tools (Unimined reads 'version.json' out of
// the installer jar) consume. Ported from the ForgeGradle build, with the loader/universal jar now coming from
// this project instead of the FG patcher.

import top.outlands.gradle.helpers.tasks.Util
import groovy.json.JsonBuilder
import groovy.json.JsonSlurper

def props = project.properties
def mcVersion = props.minecraft_version
def mcpVersion = "${props.minecraft_version}-${props.mcp_version}"
def mcpConfig = "de.oceanlabs.mcp:mcp_config:${mcpVersion}@zip"
def loaderCoords = "${project.group}:${base.archivesName.get()}:${project.version}"

// region artifact lists -----------------------------------------------------
// Resolve the 'installer' configuration (the launcher library set) into the JSON shape launchers want.
tasks.register('installerArtifacts') {
    def installerCfg = configurations.installer
    def nativesCfg = configurations.lwjglNatives
    def testCfg = configurations.findByName('testCompile')
    inputs.files(installerCfg, nativesCfg)
    def outputFile = layout.buildDirectory.file('installerArtifacts.json')
    outputs.file(outputFile)

    doLast {
        def result = [
            artifacts   : Util.getArtifacts(installerCfg, true),
            lwjglNatives: Util.getLWJGLNatives(nativesCfg, testCfg, lwjglLibraries[0], lwjglLibraries[1])
        ]
        outputFile.get().asFile.text = new JsonBuilder(result).toPrettyString()
    }
}

// region version.json -------------------------------------------------------
tasks.register('launcherJson') {
    dependsOn 'installerArtifacts', tasks.named('universalJar')
    def artifactsFile = tasks.named('installerArtifacts').flatMap { it.outputs.files.elements.map { it.first().asFile } }
    def loaderJar = tasks.named('universalJar', Jar).flatMap { it.archiveFile }
    def mmcVanilla = rootProject.file('mmcpack-template/patches/net.minecraft.json')
    def outputFile = layout.buildDirectory.file('version.json')
    // consumed by createMMCPack
    ext.output = outputFile
    inputs.file(mmcVanilla)
    inputs.files(loaderJar, artifactsFile)
    outputs.file(outputFile)

    doLast {
        def vanilla = new JsonSlurper().parse(mmcVanilla)
        def jarFile = loaderJar.get().asFile
        def timestamp = Util.iso8601Now()
        def loaderPath = "${project.group.replace('.', '/')}/${base.archivesName.get()}/${project.version}/${base.archivesName.get()}-${project.version}.jar"
        def json = [
            _comment_             : ['Outlands launcher version json'],
            id                    : "1.12.2-Outlands-${project.version}",
            time                  : timestamp,
            releaseTime           : timestamp,
            type                  : 'release',
            mainClass             : 'top.outlands.foundation.boot.Foundation',
            assetIndex            : vanilla.assetIndex,
            assets                : vanilla.assetIndex.id,
            downloads             : vanilla.downloads,
            javaVersion           : [component: 'java-runtime-epsilon', majorVersion: 25],
            complianceLevel       : 1,
            minimumLauncherVersion: 18,
            minecraftArguments    : [
                '--username', '${auth_player_name}',
                '--version', '${version_name}',
                '--gameDir', '${game_directory}',
                '--assetsDir', '${assets_root}',
                '--assetIndex', '${assets_index_name}',
                '--uuid', '${auth_uuid}',
                '--accessToken', '${auth_access_token}',
                '--userType', '${user_type}',
                '--tweakClass', 'net.minecraftforge.fml.common.launcher.FMLTweaker',
                '--versionType', 'Outlands'
            ].join(' '),
            libraries             : new ArrayList(vanilla.libraries)
        ]

        json.libraries.add([
            name     : loaderCoords,
            downloads: [
                artifact: [
                    path: loaderPath,
                    // A published build is fetchable by any launcher; a local one exists only in this workspace,
                    // where the pack carries the jar itself ('MMC-hint: local'), so it keeps the empty url.
                    url : project.hasProperty('release') ? Util.MIRROR_MAVEN_URL + loaderPath : '',
                    sha1: Util.sha1(jarFile),
                    size: jarFile.length()
                ]
            ]
        ])

        def cache = new JsonSlurper().parse(artifactsFile.get())
        cache.artifacts.each { key, lib ->
            def nameParts = (lib.name as String).split(':')
            if (nameParts.length >= 4) {
                def rawClassifier = nameParts[3].contains('@') ? nameParts[3].split('@')[0] : nameParts[3]
                // launcher JSON keeps the classifier as a fourth coordinate component
                json.libraries.add([
                    name     : "${nameParts[0]}:${nameParts[1]}:${nameParts[2]}:${rawClassifier}",
                    downloads: [artifact: lib.downloads.artifact]
                ])
            } else {
                json.libraries.add(lib)
            }
        }
        cache.lwjglNatives.each { key, lib -> json.libraries.add(lib) }

        outputFile.get().asFile.text = new JsonBuilder(json).toPrettyString()
    }
}

// region install_profile.json ----------------------------------------------
tasks.register('installerJson') {
    dependsOn 'launcherJson', tasks.named('universalJar')
    def artifactsFile = tasks.named('installerArtifacts').flatMap { it.outputs.files.elements.map { it.first().asFile } }
    def loaderJar = tasks.named('universalJar', Jar).flatMap { it.archiveFile }
    def launcherJson = tasks.named('launcherJson').flatMap { it.outputs.files.elements.map { it.first().asFile } }
    def outputFile = layout.buildDirectory.file('install_profile.json')
    inputs.files(loaderJar, artifactsFile, launcherJson)
    outputs.file(outputFile)

    doLast {
        def jarFile = loaderJar.get().asFile
        def loaderPath = "${project.group.replace('.', '/')}/${base.archivesName.get()}/${project.version}/${base.archivesName.get()}-${project.version}.jar"
        def libs = [
            (loaderCoords): [
                name     : loaderCoords,
                downloads: [
                    artifact: [
                        path: loaderPath,
                        url : project.hasProperty('release') ? Util.MIRROR_MAVEN_URL + loaderPath : '',
                        sha1: Util.sha1(jarFile),
                        size: jarFile.length()
                    ]
                ]
            ]
        ]
        Util.getClasspath(project, libs, mcpConfig)

        def json = [
            _comment_ : ['Outlands installer profile'],
            spec      : 0,
            profile   : rootProject.name,
            version   : "1.12.2-Outlands-${project.version}",
            json      : '/version.json',
            path      : loaderCoords,
            logo      : '/big_logo.png',
            minecraft : mcVersion,
            welcome   : 'installer.welcome.message',
            data      : [],
            processors: [],
            libraries : libs.values().sort { a, b -> a.name <=> b.name }
        ]
        outputFile.get().asFile.text = new JsonBuilder(json).toPrettyString()
    }
}

// region installer jar -----------------------------------------------------
tasks.register('installerJar', Zip) {
    dependsOn 'installerJson', 'launcherJson'
    archiveClassifier = 'installer'
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from({ tasks.named('installerJson').get().outputs.files })
    from({ tasks.named('launcherJson').get().outputs.files })
    from(tasks.named('universalJar')) {
        into "maven/${project.group.replace('.', '/')}/${base.archivesName.get()}/${project.version}/"
        rename { "${base.archivesName.get()}-${project.version}.jar" }
    }
    from(rootProject.file('src/main/resources/forge_logo.png')) {
        rename { 'big_logo.png' }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('assemble') {
    dependsOn 'installerJar', 'userdevJar', 'devenvZip', 'devSourcesJar'
}
// endregion

// region stale library guard ------------------------------------------------
// 1.12.2's own library set is only needed on the decompile classpath (the mcp_config 'listLibraries' output).
// Several of those modules were renamed rather than upgraded, so Gradle's version conflict resolution cannot
// see the problem: 'netty-all' (an io.netty.* fat jar) happily coexists next to the split 4.2 modules and wins
// or loses the classpath race at random, which shows up as NoSuchMethodError at compile time or
// AbstractMethodError at runtime. Keep this list in sync with CleanroomMinecraftTransformer.vanillaExcludesSet.
def staleVanillaModules = [
    'io.netty:netty-all',
    'org.lwjgl.lwjgl:lwjgl',
    'org.lwjgl.lwjgl:lwjgl_util',
    'org.lwjgl.lwjgl:lwjgl-platform',
    'com.ibm.icu:icu4j-core-mojang',
    'net.java.dev.jna:platform',
    'net.java.jinput:jinput-platform',
    'com.mojang:patchy',
    'net.java.jutils:jutils',
    'oshi-project:oshi-core',
] as Set

tasks.register('verifyNoStaleLibraries') {
    group = 'verification'
    description = 'Fails when a 1.12.2-only library (needed for decompiling) leaks onto the launch classpath.'
    dependsOn 'installerArtifacts', 'launcherJson'
    def artifactsFile = tasks.named('installerArtifacts').flatMap { it.outputs.files.elements.map { it.first().asFile } }
    def versionJsonFile = layout.buildDirectory.file('version.json')
    // The dev runs launch from the resolved runtime classpath, not from version.json: 'mcpbaseLibraries' drags in
    // 1.12.2's own library set transitively, which can reintroduce a module the packaged artifacts already exclude.
    def runtimeConfiguration = configurations.runtimeClasspath
    inputs.files(artifactsFile, versionJsonFile, runtimeConfiguration)

    doLast {
        def problems = []
        def artifacts = new JsonSlurper().parse(artifactsFile.get()).artifacts
        def fromArtifacts = artifacts.keySet().findAll { it in staleVanillaModules }
        if (fromArtifacts) problems << "installer artifacts: ${fromArtifacts.sort()}"

        def launchLibraries = new JsonSlurper().parse(versionJsonFile.get().asFile)
            .libraries.collect { it.name.split(':')[0] + ':' + it.name.split(':')[1] }
        def fromJson = launchLibraries.findAll { it in staleVanillaModules }
        if (fromJson) problems << "version.json: ${fromJson.sort()}"

        // Match on resolved coordinates: jar names alone would report our own 'lwjgl-3.4.3.jar' as LWJGL2
        def fromRuntime = runtimeConfiguration.resolvedConfiguration.resolvedArtifacts
            .collect { "${it.moduleVersion.id.group}:${it.name}".toString() }
            .findAll { it in staleVanillaModules }
            .unique()
        if (fromRuntime) problems << "dev runtime classpath: ${fromRuntime.sort()}"

        if (!problems.isEmpty()) {
            throw new GradleException("1.12.2-only libraries leaked onto the launch/dev classpath (>"
                + "replaced by upgraded modules, module names differ so Gradle cannot arbitrate):\n  "
                + problems.join('\n  '))
        }
        logger.lifecycle("verifyNoStaleLibraries: launch and dev classpaths are free of the ${staleVanillaModules.size()} 1.12.2-only modules")
    }
}
// endregion
