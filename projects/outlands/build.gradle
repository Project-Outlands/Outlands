// Outlands: the patched Minecraft + loader project.
//
// This replaces the old ForgeGradle 6 chain (:mcp -> :minecraft -> :cleanroom patcher). The MCP layer
// (decompile -> mcpcleanup -> rename, access transformers included) and the patch application live in
// ':mcpbase'; this project only adds the loader sources on top and packages everything.
//
// source layout:
//   project(':mcpbase').forgedev.patches.patched  -> patched Minecraft sources (generated)
//   $rootDir/src/main/java                        -> loader sources
//   $rootDir/src/main/resources                   -> loader resources

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'top.outlands.forgedev' version '7.0.0-beta.59-cr4'
}


import net.minecraftforge.forgedev.tasks.Reobf
import net.minecraftforge.srgutils.IMappingFile
import top.outlands.gradle.helpers.tasks.CreateMMCPackTask

import java.util.jar.JarEntry
import java.util.jar.JarInputStream
import java.util.jar.JarOutputStream
import org.apache.commons.compress.compressors.lzma.LZMACompressorInputStream
import org.apache.commons.compress.compressors.lzma.LZMACompressorOutputStream
import top.outlands.gradle.helpers.ProjectConstants
import top.outlands.gradle.helpers.tasks.Util
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.util.zip.GZIPInputStream
import java.util.zip.ZipEntry
import java.util.zip.ZipFile

def props = project.properties

group = 'top.outlands'
version = rootProject.version
// Published identity: top.outlands:outlands
base {
    archivesName = 'outlands'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    // userdev's 'sources' entry points at this jar (patched Minecraft + loader sources)
    withSourcesJar()
}

evaluationDependsOn(':mcpbase')

def mcpBase = project(':mcpbase').forgedev.mcpBase
def patches = project(':mcpbase').forgedev.patches

// FML / the loader read the MCP -> SRG mappings as plain text, while the mavenizer publishes them gzipped
def mcpToSrgSrg = layout.buildDirectory.file('mappings/srg2mcp.tsrg')
def mcpToSrg = tasks.register('mcpToSrgMappings') {
    def src = providers.provider { mcpBase.map2Srg.get() }
    def plain = layout.buildDirectory.file('mappings/srg2mcp.tsrg')
    inputs.file(src)
    outputs.files(mcpToSrgSrg, plain)
    doLast {
        new GZIPInputStream(new FileInputStream(src.get() as File)).withCloseable { ins ->
            plain.get().asFile.withOutputStream { os -> os << ins }
        }
        // The loader wants SRG -> MCP (it translates the SRG names used by FML's reflection helper
        // into the MCP names our sources/classes are compiled against)
        def mapping = IMappingFile.load(plain.get().asFile)
        mapping.reverse().write(mcpToSrgSrg.get().asFile.toPath(), IMappingFile.Format.TSRG, false)
    }
}


repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Outlands'
        url = 'https://maven.outlands.top/releases/'
    }
    // Vanilla's own library host. 1.12.2 needs a few artifacts that exist nowhere else - java3d:vecmath is the one
    // the loader compiles against (javax.vecmath in Forge's model API), lzma is carried over from vanilla's list.
    // Without this repository they only resolve from a warm Gradle cache or through the cleanroom maven, which is
    // a redirect to a third-party host - that is exactly how a local build succeeds where CI fails.
    maven {
        name = 'Mojang libraries'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        url = 'https://maven.arcseekers.com/releases/'
    }
    maven {
        name = 'Cleanroom Maven'
        url = 'https://repo.cleanroommc.com/releases/'
    }
}

ext {
    lwjglArch = Util.getCurrentArch()
    // Do not change the order unless it is required so
    lwjglLibraries = [
        [
            'lwjgl-sdl', 'lwjgl-jemalloc', 'lwjgl-openal',
            'lwjgl-opengl', 'lwjgl-stb', 'lwjgl'
        ],

        [
            'natives-linux-arm64', 'natives-linux-arm32', 'natives-linux',
            'natives-macos-arm64', 'natives-macos',
            'natives-windows-arm64', 'natives-windows-x86', 'natives-windows'
        ]
    ]
}

apply from: 'dependencies.gradle'
apply from: 'installer.gradle'

dependencies {
    // Minecraft libraries (including the vanilla assets jars) straight from the mcp config
    api project(path: ':mcpbase', configuration: 'mcpbaseLibraries')
    // In a dev run the client reads its vanilla assets (textures, sounds, font/glyph_sizes.bin) off the classpath,
    // the way ForgeGradle put the 'extra' jar on the runtime classpath. Only the run needs it, so it must not leak
    // into the published jar.
    runtimeOnly files(mcpBase.extra)
}

// The loader reports its own version at runtime (crash reports, mod metadata), so the class has
// to be generated from the current project version instead of being a stale checked-out file.
def genVersion = tasks.register('genVersion', top.outlands.gradle.helpers.tasks.GenVersionTask)

// Patched Minecraft and the loader reference each other (the patches call FML, FML calls Minecraft), so they are
// compiled together. They are separated again when packaging: the universal jar a launcher gets must not contain
// Minecraft classes. At runtime FML turns the launcher's vanilla (notch named) jar into the patched, srg named
// classes with the binary patches, and it does that for every class that reaches the class loader - including the
// ones already sitting in this jar. A Minecraft class inside the loader jar is therefore fetched *first*, fed to
// the patcher as if it were vanilla and rejected ('There is a binary discrepancy between the expected input class
// ...'), which is what killed every class whose name is not obfuscated (ClientBrandRetriever and friends).
//
// The split is done by name: the loader's own tree is known, everything else in the compiled tree came from the
// patched Minecraft sources. Names are the same in every name space here (the loader is never obfuscated).
def patchedMcSources = project(':mcpbase').layout.buildDirectory.dir('patched-mcp/src')
def generatedVersionSources = genVersion.map { it.versionClass.parentFile.parentFile.parentFile.parentFile }

// Read lazily: a clean checkout has no generated sources before their tasks ran.
def classNamesIn = { roots ->
    def names = new HashSet<String>()
    roots.each { root ->
        def dir = (root instanceof Provider ? root.get() : root) as File
        if (!dir.isDirectory()) return
        dir.eachFileRecurse { f ->
            if (!f.name.endsWith('.java')) return
            def rel = dir.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '/' as char)
            names.add(rel.substring(0, rel.length() - '.java'.length()))
        }
    }
    return names
}
def loaderClassNames = { -> classNamesIn([new File(rootDir, 'src/main/java'), generatedVersionSources]) }
def isClassOf = { names, entry ->
    if (!entry.endsWith('.class')) return false
    def name = entry.substring(0, entry.length() - '.class'.length())
    if (names.contains(name)) return true
    def nested = name.indexOf('$')
    return nested > 0 && names.contains(name.substring(0, nested))
}

sourceSets {
    main {
        java {
            srcDirs = []
            // generated: flatMap keeps the task dependency on applyPatches
            // patched sources are srg named (the pipeline runs with 'stable' mappings); the loader is written in mcp
            srcDir(patchedMcSources)
            srcDir(genVersion.map { it.versionClass.parentFile.parentFile.parentFile.parentFile })
            srcDir("$rootDir/src/main/java")
        }
        resources {
            srcDirs = ["$rootDir/src/main/resources"]
        }
    }
    test {
        compileClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
        java {
            srcDirs = ["$rootDir/src/test/java"]
        }
        resources {
            srcDirs = ["$rootDir/src/test/resources"]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs = options.compilerArgs + ProjectConstants.COMPILER_JVM_ARGUMENTS
    options.encoding = 'UTF-8'
}

processResources {
    // The extra artifact carries the vanilla assets. DefaultResourcePack resolves textures through the
    // classpath (/assets/minecraft/...) and only falls back to the asset index for the rest, so the
    // dev run needs the whole tree here, not just the marker file.
    from(mcpBase.extra.map { project.zipTree(it) }) {
        include 'assets/**'
    }
    // FML reads '/deobf_data-<mc>.tsrg' from the classpath in a deobfuscated environment
    from(mcpBase.obf2Srg) {
        rename { "deobf_data-${props.minecraft_version}.tsrg" }
    }
    inputs.property 'cleanmix_version', props.cleanmix_version
    filesMatching('cleanmix.info') {
        expand cleanmix_version: props.cleanmix_version
    }
}

test {
    maxParallelForks = 1
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    jvmArgs ProjectConstants.JVM_ARGUMENTS + ProjectConstants.COMPILER_JVM_ARGUMENTS
}


// region Run configs -------------------------------------------------------
// The loader boots through 'com.cleanroommc.boot.Main*', which forwards to FML with the env contract below.
// Slime Launcher (ForgeDev) supplies the Minecraft classpath, assets and natives, so only the loader specific
// environment variables have to be provided here.
def mcVersion = props.minecraft_version
def mcpVersion = props.mcp_version

// The asset index id comes from the version json inside the mcp metadata zip
def assetIndex = providers.provider {
    def zip = new ZipFile(mcpBase.metadata.get())
    try {
        def entry = zip.entries().find { !it.directory && it.name.endsWith('.json') }
        def json = new JsonSlurper().parse(zip.getInputStream(entry as ZipEntry))
        json.get('assetIndex')?.get('id')
    } finally {
        zip.close()
    }
}
// Assets/natives caches are shared with the old ForgeGradle setup until :outlands provisions its own.
// Resolve against gradle's own user home: it moves to D:/gradle on this setup, and hardcoding
// ~/.gradle points the launcher at a directory that does not exist.
def gradleUserHome = gradle.gradleUserHomeDir.absolutePath
def assetsDir = providers.gradleProperty('assetDirectory').getOrElse(
    new File(gradleUserHome, 'caches/forge_gradle/assets').absolutePath)
def nativesDir = providers.gradleProperty('nativesDirectory').getOrElse(
    layout.buildDirectory.dir('natives').get().asFile.absolutePath)

def loaderEnv = { String target, String tweaker ->
    [
        target          : target,
        tweakClass      : tweaker,
        mainClass       : 'top.outlands.foundation.boot.Foundation',
        MC_VERSION      : mcVersion,
        MCP_VERSION     : mcpVersion,
        MCP_MAPPINGS    : mcpBase.mappingZip.get().absolutePath,
        MCP_TO_SRG      : mcpToSrgSrg.get().asFile.absolutePath,
        assetIndex      : assetIndex.get(),
        assetDirectory  : assetsDir,
        nativesDirectory: nativesDir,
        FORGE_GROUP     : project.group.toString(),
        FORGE_VERSION   : props.last_forge_version
    ] as Map<String, String>
}

forgedev.runs {
    // :outlands does not own an mcpBase (the MCP layer lives in :mcpbase), so wire the launcher up by hand
    all { run ->
        run.cache.set(layout.buildDirectory.dir('slime-launcher-cache'))
        run.metadata(mcpBase.metadata)
    }

    outlandsClient {
        options {
            mainClass = 'com.cleanroommc.boot.MainClient'
            workingDir = file('run')
            jvmArgs = ProjectConstants.JVM_ARGUMENTS + ['-Dmixin.debug.export=true', '-Dmixin.checks.interfaces=true']
            environment.putAll(loaderEnv('fmldevclient', 'net.minecraftforge.fml.common.launcher.FMLTweaker'))
        }
    }

    outlandsServer {
        options {
            mainClass = 'com.cleanroommc.boot.MainServer'
            workingDir = file('run')
            jvmArgs = ProjectConstants.JVM_ARGUMENTS
            environment.putAll(loaderEnv('fmldevserver', 'net.minecraftforge.fml.common.launcher.FMLServerTweaker'))
        }
    }
}
// endregion

// the run configs need the plain text mappings file on disk
tasks.configureEach {
    if (name == 'runOutlandsClient' || name == 'runOutlandsServer')
        dependsOn(mcpToSrg)
}


// region Reobf + binary patches --------------------------------------------
// Legacy FML needs a 'reobfuscated' (MCP -> SRG) jar to diff against vanilla when generating binary patches. The
// whole tree (patched Minecraft + loader) is renamed in one go; the two class sets are split again afterwards,
// because they end up in different places:
//   Minecraft  -> the dirty side of the binary patches
//   loader     -> the universal jar a launcher gets
//   both       -> the '-srg' jar, the 'classes' artifact ForgeDev 7 hands to mod projects
def jarForReobf = tasks.register('jarForReobf', Jar) {
    archiveClassifier = 'reobf-input'
    destinationDirectory = layout.buildDirectory.dir('reobf-input')
    from sourceSets.main.output
}

def reobf = tasks.register('reobf', Reobf) {
    input.from(jarForReobf)
    mappings.set(layout.file(providers.provider { mcpBase.map2Srg.get() }))
    output.set(layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}-srg.jar"))
    disableAbstractParams.set(false)
}

// The patcher diffs two jars that have to be in the *same* name space, so the dirty side is reobfuscated to notch
// (the clean side is the launcher's vanilla jar) and '--srg' bakes the notch -> srg renames into the patch. Renaming
// the dirty side to srg instead makes binarypatcher emit empty patches for every class (it cannot line the two up).
def reobfObf = tasks.register('reobfObf', Reobf) {
    input.from(jarForReobf)
    // MCP -> notch. The mavenizer publishes it next to the metadata, but ForgeDev's MCPBase does not expose a
    // provider for it yet (MCPData.map2obf exists, PatcherBase only forwards map2srg/obf2srg).
    mappings.set(layout.file(providers.provider {
        new File(mcpBase.metadata.get().parentFile, 'mappings.map2obf.tsrg.gz')
    }))
    // The loader's own classes are not obfuscated, so they ship with srg names. The renamer resolves members through
    // the class hierarchy, and without this it would rename a loader member that a game type declares into its notch
    // name - a name nothing provides: the loader jar has the srg one, and the runtime deobfuscator has no mapping for
    // a net/minecraftforge/... owner. The patches keep Minecraft's names in notch (coremods see those before
    // deobfuscation, as they always have) and take loader names in srg, which is the space they are shipped in.
    loaderSpace.set(layout.file(mcpBase.map2Srg))
    output.set(layout.buildDirectory.file('reobf-input/minecraft-obf.jar'))
    disableAbstractParams.set(false)
}

// Only Minecraft: the patcher must not emit 'this class does not exist in the vanilla jar' entries for the loader's
// own classes, FML would then try to patch them onto the copies that are already in the universal jar.
def obfMcJar = tasks.register('obfMcJar', Jar) {
    archiveClassifier = 'mc-obf'
    destinationDirectory = layout.buildDirectory.dir('reobf-input')
    dependsOn reobfObf
    def loaderNames = []
    doFirst { loaderNames = loaderClassNames() }
    from { zipTree(reobfObf.get().output.get().asFile) }
    include { entry -> !isClassOf(loaderNames, entry.path) }
}

// The vanilla jars, notch named: FML feeds these exact bytes through the patcher, so every patch checksum has to be
// taken from them (mcpBase.classes, the patched srg named classes, are the *output* of the patches, not the input).
def mcFiles = forgedev.minecraftFiles(props.minecraft_version)

// Only classes the source patches touch need a binary patch. Every other Minecraft class still differs from vanilla
// after a recompile (source file attribute, bytecode version, line numbers, injected annotations - and every constant
// pool shift drags the instructions along), which used to bloat the pack with a patch per class. Forge and Cleanroom
// both ship patches for the touched set only; the rest is renamed at runtime by the remapper.
def mcpPatches = project(':mcpbase').forgedev.patches

// 1.12.2's server download is a fat jar (bundled libraries and all). Patches are only wanted for classes that the
// loader also has - Minecraft's - because a 'this class does not exist in the target' entry for, say, Guava's
// annotations would be applied to the real library at runtime.
def vanillaCleanJar = { String side, Provider<File> vanilla ->
    tasks.register("vanillaClean${side.capitalize()}", Jar) {
        archiveClassifier = "vanilla-${side}".toString()
        destinationDirectory = layout.buildDirectory.dir('reobf-input')
        inputs.file(vanilla)
        dependsOn obfMcJar
        def keep = [] as Set
        doFirst {
            keep = new java.util.zip.ZipFile(obfMcJar.get().archiveFile.get().asFile).withCloseable { zip ->
                zip.entries().collect { it.name } as Set
            }
        }
        from(zipTree(vanilla))
        include { entry -> keep.contains(entry.path) }
        includeEmptyDirs = false
    }
}

// Side specific patch sets (used by the installer / applyBinPatches), named after the loader's runtime entries
['client', 'server'].each { side ->
    def vanilla = vanillaCleanJar(side, side == 'client' ? mcFiles.getClient() : mcFiles.getServer())
    forgedev.binaryPatches(side) {
        create {
            getPrefix().set(["binpatch/${side}".toString()])
            getClean().setFrom(vanilla)
            getDirty().setFrom(obfMcJar.flatMap { it.archiveFile })
            // notch -> srg, so the patches rename the vanilla classes as they apply
            getSrg().setFrom(mcpBase.obf2Srg)
            // 'patches/minecraft', the same set the patched tree was built from
            getPatches().setFrom(mcpPatches.getPatches())
        }
        apply {
            getClean().setFrom(vanilla)
        }
    }
}

// endregion

// The universal jar: what a launcher puts on the classpath. Srg named loader classes, the resources (deobf data,
// cleanmix info) and the binary patches that turn Minecraft into the patched classes at startup.
// The plain 'jar' task still exists for debugging (MCP named, loader only), it is not published.
tasks.named('jar') {
    archiveClassifier = 'mcp'
}

def universalJar = tasks.register('universalJar', Jar) {
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('libs')
    dependsOn reobf
    def loaderNames = []
    doFirst { loaderNames = loaderClassNames() }
    // lazy: the renamed jar only exists once 'reobf' ran
    from { zipTree(reobf.get().output.get().asFile) }
    // loader classes only, every Minecraft class comes from the patches at runtime
    exclude { entry -> entry.path.endsWith('.class') && !isClassOf(loaderNames, entry.path) }
    from(sourceSets.main.output.resourcesDir)
    from(binpatchesPack) {
        rename { 'binpatches.pack.lzma' }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// FML 1.12.2 reads a single '/binpatches.pack.lzma' resource: an LZMA compressed jar whose entries are
// 'binpatch/client/<class>.binpatch' and 'binpatch/server/<class>.binpatch'. binarypatcher produces one pack per
// side, so they get merged here.
//
// The entries are stored, not deflated: the jar is compressed as a whole afterwards (that is the LZMA stream FML
// reads), and deflating first costs about half of the pack - the two sides share almost all of their content, which
// only a compressor that sees the raw bytes can exploit. binarypatcher stores them for the same reason.
def binpatchesPack = tasks.register('binpatchesPack') {
    def clientPack = forgedev.binaryPatches('client').create.flatMap { it.output }
    def serverPack = forgedev.binaryPatches('server').create.flatMap { it.output }
    inputs.files(clientPack, serverPack)
    def output = layout.buildDirectory.file('binpatches.pack.lzma')
    outputs.file(output)

    doLast {
        def jarBytes = new ByteArrayOutputStream()
        def jos = new JarOutputStream(jarBytes)
        try {
            [clientPack.get().asFile, serverPack.get().asFile].each { pack ->
                new LZMACompressorInputStream(new FileInputStream(pack)).withCloseable { ins ->
                    new JarInputStream(ins).withCloseable { jis ->
                        for (def entry = jis.nextJarEntry; entry != null; entry = jis.nextJarEntry) {
                            byte[] data = jis.readAllBytes()
                            def stored = new JarEntry(entry.name)
                            stored.method = java.util.zip.ZipEntry.STORED
                            stored.size = data.length
                            stored.compressedSize = data.length
                            stored.crc = new java.util.zip.CRC32().with { update(data); value }
                            jos.putNextEntry(stored)
                            jos.write(data)
                            jos.closeEntry()
                        }
                    }
                }
            }
        } finally {
            jos.close()
        }

        output.get().asFile.withOutputStream { os ->
            def lz = new LZMACompressorOutputStream(os)
            lz.write(jarBytes.toByteArray())
            lz.close()
        }
    }
}

tasks.named('jar', Jar) {
    // installed by the installer? no - the launcher JSON points at the universal jar, this one is only for local
    // inspection of the pre-rename classes
    from(binpatchesPack) {
        rename { 'binpatches.pack.lzma' }
    }
}


// region materialized dev environment --------------------------------------
// ForgeDev 7 has no patch-application step for mod projects: its mcp artifact *is* the dev target (classes, srg
// classes, sources, mappings, metadata, extra). 'outlands' can play that role because this build already materializes
// the whole chain (mcp_config -> our patches -> loader), so no decompile happens on the consumer side.
//
// The userdev set is not enough for it: userdev's 'sources' is the patch target, i.e. the loader only, because its
// consumer gets the Minecraft sources from mcp_config - ForgeDev has no such second source provider.
//
// What cannot be provided: 'sources.srg'. Renaming mcp -> srg on sources needs ast level analysis; the mavenizer's
// RenameSourcesCli is srg -> mcp only, and it says the reverse is unsupported by the whole stack. The key is left out
// instead of pointing it at the mcp named jar (which would be a lie that only shows up in SRG-level tools).
def devenvDir = layout.buildDirectory.dir('devenv')

def devenvJson = tasks.register('devenvJson') {
    // The launcher library set is the dev classpath: vanilla's libraries plus what the loader adds.
    dependsOn 'installerArtifacts'
    def artifactsFile = tasks.named('installerArtifacts').flatMap { it.outputs.files.elements.map { it.first().asFile } }
    def output = devenvDir.map { it.file('devenv.json') }
    inputs.file(artifactsFile)
    outputs.file(output)
    doLast {
        def libraries = new JsonSlurper().parse(artifactsFile.get()).artifacts.values().collect { it.name }
        def json = [
            config            : "${project.group}:${base.archivesName.get()}:${project.version}".toString(),
            pipeline          : 'joined',
            'mc.version'      : props.minecraft_version,
            'mappings.channel': props.mapping_channel,
            'mappings.version': props.mapping_version,
            dependencies      : libraries.sort().join(','),
            'loader.version'  : project.version.toString()
        ]
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.text = JsonOutput.prettyPrint(JsonOutput.toJson(json))
    }
}

// The Minecraft sources are the ones the loader is compiled against: patched, mcp named. They are shipped as a
// separate classifier because '-sources' must stay loader-only (userdev applies patches to it).
tasks.register('devSourcesJar', Jar) {
    archiveClassifier = 'dev-sources'
    // the patched tree belongs to :mcpbase, and wiring its directory in directly hides the producer from Gradle
    dependsOn ':mcpbase:applyPatches'
    from(patches.patched)
    from("$rootDir/src/main/java") {
        exclude 'net/minecraft/**'
    }
}

// Everything ForgeDev reads besides the three big jars, in the shape it expects: the mcp config's own metadata/extra
// and mappings are forwarded as-is (they describe the base this artifact was materialized from).
tasks.register('devenvZip', Zip) {
    archiveClassifier = 'devenv'
    archiveExtension = 'zip'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(devenvJson)
    from(mcpBase.mappingZip) { rename { 'mappings/mappings.zip' } }
    from(mcpBase.map2Srg) { rename { 'mappings/map2srg.tsrg.gz' } }
    from(mcpBase.obf2Srg) { rename { 'mappings/obf2srg.tsrg' } }
    from(mcpBase.metadata) { rename { 'metadata.zip' } }
    from(mcpBase.extra) { rename { 'extra.jar' } }
}
// endregion

// region userdev ------------------------------------------------------------
// Classic userdev artifact (spec 2): config.json + joined.lzma + patches/ + ats/ + sources.
// Consumed by ForgeGradle 3-5, the ModDevGradle legacy fork and the Unimined fork.
// region loader sources -----------------------------------------------------
// The userdev 'sources' artifact is what the consumer injects into its Minecraft tree, so it must contain the
// loader's own sources only. The patched Minecraft sources are already produced by mcp_config; shipping them here
// duplicates every minecraft class (and breaks patch application downstream).
tasks.register('loaderSourcesJar', Jar) {
    archiveClassifier = 'sources'
    from("$rootDir/src/main/java") {
        exclude 'net/minecraft/**'
    }
}
// endregion

forgedev.userDev {
    base(mcpBase)

    binaryPatches {
        // The final jar carries binpatches.pack.lzma and deobf data, the patches must not
        clean.setFrom(providers.provider { mcpBase.classesRaw.get() })
        dirty.setFrom(obfMcJar.flatMap { it.archiveFile })
        srg.setFrom(mcpBase.obf2Srg)
        // only the classes patched in 'patches/minecraft', the rest of Minecraft is renamed at runtime
        getPatches().setFrom(mcpPatches.getPatches())
        // FG/Unimined look entries up as 'binpatch/<side>/<class>.binpatch'
        getPrefix().set(['binpatch/joined'])
    }

    config {
        sources(tasks.named('loaderSourcesJar'))
        universal(tasks.named('universalJar'))
        // Consumers (Unimined/Loom-style integration) read the launch recipe from here; it mirrors the
        // launch command in the installer's version.json.
        runs {
            client {
                main = 'top.outlands.foundation.boot.Foundation'
                args = ['--tweakClass', 'net.minecraftforge.fml.common.launcher.FMLTweaker',
                        '--versionType', 'Outlands']
                jvmArgs = ['-Dfml.ignoreInvalidMinecraftCertificates=true',
                           '-Dfml.ignorePatchDiscrepancies=true']
                env = ['side': 'client']
            }
            server {
                main = 'top.outlands.foundation.boot.Foundation'
                args = ['--tweakClass', 'net.minecraftforge.fml.common.launcher.FMLTweaker',
                        '--versionType', 'Outlands']
                env = ['side': 'server']
            }
        }
    }
}

// The patch set is maintained in patches/minecraft, so it is packaged as-is instead of regenerating it.
// 'before/' + 'after/' prefixes make UserdevConfig write spec 2.
forgedev.userDev.jar {
    from(file("$rootDir/patches/minecraft")) {
        into 'patches'
    }
}

forgedev.userDev.config {
    patchesOriginalPrefix.set('before')
    patchesModifiedPrefix.set('after')
}
// endregion

tasks.register('outlandsInfo') {
    doLast {
        println 'src    : ' + patches.patched.get().asFile
        println 'mc     : ' + mcpBase.namedSources.get()
    }
}

// region publishing ---------------------------------------------------------
// top.outlands:outlands (universal), :userdev and :installer are the three artifacts consumers resolve.
// Only the token is a secret: 'fg' is a shared publishing account, so it can stay visible in the logs (masking it
// would turn every two-letter occurrence in the log into '***' anyway). Same flags locally and in CI:
//   ./gradlew publish -PoutlandsToken=... [-PoutlandsUsername=fg] [-Prelease]
publishing {
    repositories {
        maven {
            name = 'outlands'
            url = 'https://maven.outlands.top/releases'
            credentials {
                username = project.findProperty('outlandsUsername') ?: 'fg'
                password = project.findProperty('outlandsToken') ?: ''
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        outlands(MavenPublication) {
            groupId = project.group
            artifactId = 'outlands'
            version = project.version
            artifact(tasks.named('universalJar'))
            artifact(tasks.named('loaderSourcesJar')) { extension = 'jar' }
            artifact(tasks.named('userdevJar')) { classifier = 'userdev'; extension = 'jar' }
            artifact(tasks.named('installerJar')) { classifier = 'installer'; extension = 'jar' }
            // ForgeDev 7 dev target: sources that include patched Minecraft, and the mappings/metadata it reads
            artifact(tasks.named('devSourcesJar')) { classifier = 'dev-sources'; extension = 'jar' }
            artifact(tasks.named('devenvZip')) { classifier = 'devenv'; extension = 'zip' }
            // srg-named classes: FG7's MCPBase.getClasses() prefers 'classes.srg'
            artifact(layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}-srg.jar")) {
                classifier = 'srg'; extension = 'jar'; builtBy tasks.named('reobf')
            }
        }
    }
}
// endregion

// region MMC/Prism pack -----------------------------------------------------
// The launcher-facing distribution: mmc-pack.json + the per-component patch JSONs (forge slot carries the loader,
// lwjgl3 slot carries our LWJGL build) + the loader jar for local (non-release) builds.
tasks.register('createMMCPack', CreateMMCPackTask) {
    group = 'build'
    description = 'Creates a MultiMC/Prism instance package for Outlands'
    dependsOn 'launcherJson', 'universalJar'

    versionJson = tasks.named('launcherJson').get().ext.output
    templateDir = rootProject.layout.projectDirectory.dir('mmcpack-template')
    universalJarFile = tasks.named('universalJar', Jar).flatMap { it.archiveFile }
    loaderVersion = project.version.toString()
    loaderCoords = "${project.group}:${base.archivesName.get()}".toString()
    // Players take everything that is not central or Mojang's from the mirror that backs repo.cleanroommc.com.
    releaseBaseUrl = Util.MIRROR_MAVEN_URL
    // 'release' is what CI passes when publishing. A plain build keeps the 'local' pack (it carries the loader jar,
    // a release pack points at the maven URL instead), so the flag - not the version string - decides this.
    def releaseBuild = project.hasProperty('release')
    isRelease = releaseBuild
    outputZip = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}${releaseBuild ? '' : '-local'}.zip")
}

tasks.named('assemble') { dependsOn 'createMMCPack' }
tasks.named('compileJava') { dependsOn ':mcpbase:renamePatchedSources' }
// endregion

// region checks -------------------------------------------------------------
// The FG6 build shipped its own copies of these (buildSrc CheckPatches/CheckAccessTransformers/CheckSAS), but
// ForgeDev already provides them: Checks registers checkPatches/checkAts/checkSas/checkExecs lazily and wires them
// into the standard 'check' lifecycle task. They only need to be opted in.
def checks = forgedev.checks
checks.base(project(':mcpbase').forgedev.mcpBase)
// ats()/sas() are parked: both need extractInheritance, and ForgeDev's Checks.setBase wires its input from
// ':mcpbase:mcpbaseDependencies', which Gradle 9 refuses to resolve from an ':outlands' task action
// ("resolution of the configuration ... was attempted without an exclusive lock"). Re-enable once the fork
// resolves that configuration eagerly (e.g. by passing a FileCollection captured at configuration time).
// checks.ats {}
// checks.sas {}
checks.patches { it.patchDir.set(rootProject.layout.projectDirectory.dir('patches/minecraft')) }
checks.execs {}
// endregion
